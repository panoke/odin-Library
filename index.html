<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP - Library</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 id="title">TOP - Project: Library</h1>
    <button id="addBook" command="show-modal" commandfor="newBook">Add Book</button>
    <dialog id="newBook" closedby="any">
        <p>Specify Details of New Book - Click outside to close.</p>
        <label for="author">Author</label>
        <input type="text" id="author" name="author">
        <label for="title">Title</label>
        <input type="text" id="title" name="title">
        <label for="pages">Number of Pages</label>
        <input type="number" id="pages" name="pages">
        <label for="read">Read</label>
        <input type="checkbox" name="read" id="read">
        <button commandfor="newBook" command="close">Submit</button>
    </dialog>

    <table id="bookTable">
        <caption>Table of Books</caption>
        <thead>
            <tr>
                <th scope="col">Author</th>
                <th scope="col">Title</th>
                <th scope="col">Pages</th>
                <th scope="col">Read</th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>






</body>
</html>
